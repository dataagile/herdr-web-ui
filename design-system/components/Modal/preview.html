<!-- @dsCard group="Overlays" height=470 subtitle="New project dialog: header, fields, footer" -->
<div class="ds-stage">
  <div class="modal-scrim new-session-scrim">
    <form class="modal new-session-modal" role="dialog" aria-modal="true" aria-labelledby="ds-new-session-title">
      <header class="modal-header">
        <h2 class="modal-title" id="ds-new-session-title">New project &middot; devbox</h2>
        <button type="button" class="icon-button" aria-label="Close dialog">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <div class="modal-body">
        <div class="field">
          <span class="field-label" id="ds-new-session-agent">Agent</span>
          <div class="agent-picker">
            <button type="button" class="select agent-picker-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="ds-new-session-agent">
              <span class="agent-picker-shell"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg></span>
              <span class="agent-picker-label">Shell</span>
              <svg class="agent-picker-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="ds-new-session-cwd">Directory</label>
          <div class="new-session-cwd">
            <input id="ds-new-session-cwd" class="input" value="~/dev/api" autocomplete="off">
            <button type="button" class="btn" aria-expanded="false">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
              Browse
            </button>
          </div>
          <span class="field-hint">absolute path or ~/&hellip;</span>
        </div>
        <label class="field">
          <span class="field-label">Name</span>
          <input class="input" value="" autocomplete="off" placeholder="api">
          <span class="field-hint">Optional project label</span>
        </label>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Start</button>
      </footer>
    </form>
  </div>
</div>
<style>
  .ds-stage { padding: 0; background: var(--bg); font-family: var(--font-ui); color: var(--text); }
  .ds-stage .modal-scrim { position: relative; inset: auto; z-index: auto; min-height: 470px; padding: var(--space-4); }
</style>
