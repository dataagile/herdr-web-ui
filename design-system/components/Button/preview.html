<!-- @dsCard group="Actions" height=220 subtitle="Text buttons (.btn) and square icon buttons (.icon-button)" -->
<div class="ds-stage">
  <div class="ds-label">Text buttons</div>
  <div class="ds-row">
    <button type="button" class="btn btn-primary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New project</button>
    <button type="button" class="btn">Cancel</button>
    <button type="button" class="btn btn-danger"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>Close project</button>
    <button type="button" class="btn btn-ghost split-button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>Split</button>
  </div>
  <div class="ds-row">
    <button type="button" class="btn btn-primary" disabled>Create worktree</button>
    <button type="button" class="btn" disabled>Reconnect</button>
  </div>
  <div class="ds-label">Drawer rows (&lt;=768px; the pane's path and the palette)</div>
  <div class="drawer-rows" style="display:flex;max-width:320px">
    <p class="drawer-path">/home/dev/<wbr>projects/<wbr>herdr-web-ui/<wbr>feature-branch</p>
    <button type="button" class="btn btn-ghost drawer-palette"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><span>Command palette</span></button>
  </div>
  <div class="ds-label">Icon buttons</div>
  <div class="ds-row">
    <button type="button" class="icon-button" aria-label="Sign out" title="Sign out"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
    <span class="header-bell"><button type="button" class="icon-button" aria-label="Alerts" title="Alerts are off on this device" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742"/><path d="m2 2 20 20"/><path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05"/></svg></button><span class="header-bell-dot" aria-hidden="true"></span></span>
    <span class="ds-sep" aria-hidden="true"></span>
    <button type="button" class="icon-button is-outlined" aria-label="Decrease terminal font size"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
    <button type="button" class="icon-button is-outlined" aria-label="Increase terminal font size"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    <button type="button" class="icon-button is-outlined" aria-label="Increase terminal font size" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    <button type="button" class="icon-button context-copy in-crumb" aria-label="Copy path" title="Copy path"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    <span class="ds-note">default · header bell (dot = alerts off) · copy path · outlined · disabled</span>
  </div>
</div>
<style>
.ds-stage{background:var(--bg-panel);padding:var(--space-4);font-family:var(--font-ui);color:var(--text);display:flex;flex-direction:column;gap:var(--space-3)}
.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)}
.ds-label{font-size:var(--fs-2xs);color:var(--text-dim);text-transform:uppercase;letter-spacing:var(--tracking-caps);font-weight:var(--fw-semibold)}
.ds-sep{width:1px;height:20px;background:var(--border);margin:0 var(--space-2)}
.ds-note{font-size:var(--fs-xs);color:var(--text-dim);margin-left:var(--space-2)}
</style>
